server {
    listen 80;
    root /var/www;
    index index.php index.html;

    access_log /dev/stdout;
    error_log /dev/stderr;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # Real IP from trusted proxies
    set_real_ip_from 10.0.0.0/8;
    include /etc/nginx/cloudflare-ips.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    #
    # Whitelist: only these paths serve static files directly.
    # All other paths go through index.php for access control.
    #

    # Root public files — fallback to CMS if not found
    location ~ ^/favicon\.ico { try_files $uri /index.php; }
    location ~ ^/robots\.txt  { try_files $uri /index.php; }
    location ~ ^/sitemap\.xml { try_files $uri /index.php; }
    location ~ ^/humans\.txt  { try_files $uri /index.php; }

    # Storage sub-paths — return 404 if file not found
    location ~ ^/storage/app/uploads/public/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri 404;
    }
    location ~ ^/storage/app/media/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri 404;
    }
    location ~ ^/storage/app/resized/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri 404;
    }
    location ~ ^/storage/temp/public/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri 404;
    }

    # Module/theme static assets — return 404 if file not found
    location ~ ^/(modules|themes)/.+/(assets|resources)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri 404;
    }
    # Plugin static assets — return 404 if file not found
    location ~ ^/plugins/[^/]+/[^/]+/(assets|resources)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri 404;
    }

    # Only index.php goes through PHP-FPM
    location ~ ^/index\.php$ {
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_connect_timeout 120s;
        fastcgi_read_timeout    120s;
        fastcgi_send_timeout    120s;
    }

    # All other requests → CMS routing
    location / {
        rewrite ^ /index.php last;
    }
}
